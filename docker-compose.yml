services:
  db:
    image: postgres:16-alpine
    container_name: marketpulse-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpulse}
      POSTGRES_DB: ${POSTGRES_DB:-marketpulse}
    volumes:
      - marketpulse-db:/var/lib/postgresql/data
    ports:
      # Host port 5433 by default so a local PostgreSQL on 5432 is not shadowed.
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: marketpulse-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketpulse}:${POSTGRES_PASSWORD:-marketpulse}@db:5432/${POSTGRES_DB:-marketpulse}
      DATABASE_DIR: /database
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-demo}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      LIVE_SNAPSHOT_REFRESH_MS: ${LIVE_SNAPSHOT_REFRESH_MS:-5000}
      LIVE_STALE_THRESHOLD_MS: ${LIVE_STALE_THRESHOLD_MS:-15000}
      UPSTOX_SUBSCRIPTION_MODE: ${UPSTOX_SUBSCRIPTION_MODE:-full}
      UPSTOX_SUBSCRIPTION_BATCH_SIZE: ${UPSTOX_SUBSCRIPTION_BATCH_SIZE:-100}
      DEMO_TICK_INTERVAL_MS: ${DEMO_TICK_INTERVAL_MS:-1500}
      REPLAY_DATASET_SOURCE: ${REPLAY_DATASET_SOURCE:-demo}
      REPLAY_SESSION: ${REPLAY_SESSION:-}
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
      REPLAY_MAX_EVENTS: ${REPLAY_MAX_EVENTS:-200000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      # Schema and seed SQL are applied by the backend on startup (idempotent).
      - ./database:/database:ro
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: marketpulse-frontend
    ports:
      - '${FRONTEND_PORT:-5000}:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  marketpulse-db:
